general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper-2.png

    blur_passes = 0
    blur_size = 10

    noise = 0.0117
    contrast = 0.90
    brightness = 0.82
    vibrancy = 0.20
    vibrancy_darkness = 0.15
}

image {
    monitor =
    path = ~/.face

    size = 150
    rounding = -1

    border_size = 3
    border_color = rgb(7aa2f7)

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"

    color = rgb(c0caf5)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"

    color = rgb(a9b1d6)
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER

    color = rgb(7aa2f7)
    font_size = 28
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -95
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 340, 58
    rounding = 14

    outline_thickness = 2

    outer_color = rgb(7aa2f7)
    inner_color = rgba(1a1b26ee)
    font_color = rgb(c0caf5)

    dots_center = true
    dots_size = 0.30
    dots_spacing = 0.25

    fade_on_empty = false

    placeholder_text = <span foreground="##565f89">Enter Password</span>

    check_color = rgb(7dcfff)
    fail_color = rgb(f7768e)
    fail_text = <span foreground="##f7768e"><b>Authentication Failed</b></span>

    capslock_color = rgb(e0af68)
    capslock_text = <span foreground="##e0af68"><b>CAPS LOCK IS ON</b></span>

    position = 0, -185
    halign = center
    valign = center
}

label {
    monitor =
    text = Press Enter to Unlock

    color = rgb(565f89)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, -260
    halign = center
    valign = center
}
